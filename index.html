<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container mt-5">
    <header class="text-center mb-4">
      <h1>Weather Dashboard</h1>
      <input type="text" id="cityInput" class="form-control" placeholder="Enter city name" />
      <button id="searchBtn" class="btn btn-primary mt-2">Get Weather</button>
    </header>

    <div id="errorMsg" class="alert alert-danger d-none"></div>

    <div id="weatherResult" class="card p-3 d-none">
      <h3 id="cityName"></h3>
      <p><strong>Temperature:</strong> <span id="temperature"></span>°C</p>
      <p><strong>Humidity:</strong> <span id="humidity"></span>%</p>
      <p><strong>Conditions:</strong> <span id="conditions"></span></p>
    </div>

    <footer class="text-center mt-5">
      <small>Powered by OpenWeatherMap API</small>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
